name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # check → unit → build (production, into dist/) → e2e (Playwright builds its own
      # PUBLIC_E2E=1 copy into dist-e2e/, which is never uploaded)
      - run: npm run ci
        env:
          CI: true
          ASTRO_TELEMETRY_DISABLED: 1
      # Guard: the deployable artifact must not be a test build.
      - name: Verify dist is a production build
        run: |
          if grep -rqE ' data-key-override([ >=]|$)' dist; then
            echo "dist/ contains the E2E-only key override" >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
